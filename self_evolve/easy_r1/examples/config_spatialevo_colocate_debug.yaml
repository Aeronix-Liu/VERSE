# Minimal colocate debug config — probe Actor / Ref / vLLM init on 1–2 GPUs.
# Usage: bash scripts/debug_colocate_stages.sh

data:
  train_files: ./dataset/spatialevo_train_local.jsonl
  val_files: ./dataset/scannet_val_multi_frame_local.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 4096
  max_response_length: 512
  rollout_batch_size: 2
  mini_rollout_batch_size: 2
  val_batch_size: 2
  shuffle: false
  seed: 42
  min_pixels: 100352
  max_pixels: 100352
  filter_overlong_prompts: false
algorithm:
  adv_estimator: grpo
  two_round_training: true
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
worker:
  actor:
    global_batch_size: 2
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: /data/pengtianshuo/self_evolve/models/Qwen3-VL-8B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 2
    temperature: 1.0
    max_model_len: 5120
    max_num_batched_tokens: 5120
    top_p: 1.0
    limit_images: 2
    gpu_memory_utilization: 0.35
    enforce_eager: true
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: true
  ref:
    # Keep ref weights on GPU during colocate init. CPU offload + actor CPU offload
    # pushes VmRSS >80GB and triggers host OOM killer (not GPU OOM at ~11GB).
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: false
  reward:
    reward_function: ./training/reward_function/unified_reward.py:compute_score
    num_cpus: 1
trainer:
  total_epochs: 1
  max_steps: 1
  project_name: VERSE
  experiment_name: colocate_debug
  logger: [file]
  nnodes: 1
  n_gpus_per_node: 1
  val_before_train: false
  val_freq: -1
  save_freq: -1
  save_checkpoint_path: ./checkpoints/colocate_debug
  find_last_checkpoint: false
