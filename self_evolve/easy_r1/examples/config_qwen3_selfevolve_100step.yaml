# Self-evolve GRPO (structured_imitate Proposer) for Qwen3-VL-4B on 8xA800 (GPU 0-7).
# Cloned from config_phase2_structured_imitate.yaml. Only changes:
#   - model.model_path: Qwen3-VL-4B RRS-final (checkpoints/Qwen3-4B/rrs) instead of vilasr_reflective_4gpu
#   - trainer.n_gpus_per_node: 8 (instead of 4) — using all 8 A800s
#   - trainer.experiment_name / save_checkpoint_path: routed under Qwen3-4B/ namespace
#   - trainer.save_freq: 25 (checkpoints at 25/50/75/100). Qwen2.5-VL-7B 4-GPU
#     imitate-0808 took ~36 h/100 steps, so Qwen3-VL-4B on 8 GPUs is expected ~10-15 h
#     /100 steps; a step-25 checkpoint gives an early safety net.
#   - data.train_files: v3 (4699 samples). Schedule stays v2 (193 steps, same as
#     imitate-0807 which established v3-data+v2-schedule works via modality-aware
#     dataloader). max_steps stays 100.
# All other knobs (rollout_batch_size, rollout.n=8, TP=2, rollout gpu_memory_utilization
# 0.35, num_llm_calls_available=6, KL 0.01, lr 1e-6, temp 1.0, etc.) are identical to the
# Qwen2.5-VL-7B Phase-2 imitate run for clean comparison.

data:
  train_files: ./dataset/full_selfevolve_train_v3.jsonl
  val_files: ./dataset/full_selfevolve_train_v3.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 6144
  max_response_length: 8192
  rollout_batch_size: 16
  mini_rollout_batch_size: 16
  val_batch_size: 16
  override_chat_template: null
  shuffle: false
  seed: 42
  min_pixels: 100352
  max_pixels: 200704
  filter_overlong_prompts: false
algorithm:
  adv_estimator: grpo
  two_round_training: true
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
worker:
  actor:
    global_batch_size: 16
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    use_torch_compile: false
    model:
      model_path: /data/pengtianshuo/self_evolve/Xinran/checkpoints/Qwen3-4B/rrs
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    max_model_len: 32768
    max_num_batched_tokens: 32768
    limit_images: 32
    gpu_memory_utilization: 0.35
    enforce_eager: true
    enable_chunked_prefill: true
    tensor_parallel_size: 2
    disable_tqdm: true
    single_turn_response_length: 1024
    num_llm_calls_available: 6
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
  reward:
    reward_function: ./training/reward_function/unified_reward.py:compute_score
    reward_function_kwargs:
      agentic_solver: true
      question_quality_kwargs:
        model: gpt-4o-mini
        api_key: EMPTY
        service_url: https://api.openai.com/v1
        timeout: 120
      majority_correctness_kwargs:
        model: gpt-4o-mini
        api_key: EMPTY
        service_url: https://api.openai.com/v1
        timeout: 120
    skip_special_tokens: true
    num_cpus: 2
trainer:
  total_epochs: 10
  max_steps: 100
  project_name: ViLaSR-SelfEvolve
  experiment_name: qwen3_selfevolve_100step
  logger:
  - file
  - wandb
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 100
  world_simulator_max_workers: 4
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 25                     # checkpoints at 25/50/75/100
  save_limit: 4
  save_model_only: true
  save_checkpoint_path: /data/pengtianshuo/self_evolve/Xinran/checkpoints/Qwen3-4B/self_evolve
  load_checkpoint_path: null
  find_last_checkpoint: true
