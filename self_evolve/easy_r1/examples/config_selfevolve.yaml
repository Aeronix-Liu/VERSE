data:
  train_files: ./dataset/selfevolve_train.jsonl
  val_files: ./dataset/selfevolve_train.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 6144
  # Total multi-turn response budget for the agentic Solver (all turns +
  # tool-feedback images). ViLaSR used 13312 on 32 GPUs; 8192 keeps the 4-GPU
  # colocate footprint safe.
  max_response_length: 8192
  rollout_batch_size: 4
  mini_rollout_batch_size: 4
  val_batch_size: 4
  override_chat_template: null
  shuffle: true
  seed: 42
  min_pixels: 100352
  # 200704 px ~= 256 image tokens (ViLaSR RL setting); mazes render at 616x616
  # and downscale to ~448x448 (28-divisible via fetch_image).
  max_pixels: 200704
  filter_overlong_prompts: false
algorithm:
  adv_estimator: grpo
  two_round_training: true
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    use_torch_compile: false
    model:
      # Stage-2 (Reflective Rejection Sampling) final checkpoint = self-evolve start.
      model_path: /data/pengtianshuo/self_evolve/Xinran/checkpoints/vilasr_reflective_4gpu
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
      offload_optimizer: false
  rollout:
    n: 4
    temperature: 1.0
    top_p: 1.0
    # prompt(6144) + response(8192) + slack
    max_model_len: 14848
    max_num_batched_tokens: 14848
    # Original frames (<=4) + tool-edited feedback images per trajectory.
    limit_images: 24
    gpu_memory_utilization: 0.40
    enforce_eager: true
    enable_chunked_prefill: true
    tensor_parallel_size: 4
    disable_tqdm: true
    # --- agentic (ViLaSR think->draw->observe) settings ---
    single_turn_response_length: 1024
    num_llm_calls_available: 6
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: true
  reward:
    reward_function: ./training/reward_function/unified_reward.py:compute_score
    reward_function_kwargs:
      # Round-2 Solver reward = agentic gcot format + DGE/Maze GT accuracy.
      agentic_solver: true
      question_quality_kwargs:
        model: gpt-4o-mini
        api_key: EMPTY
        service_url: https://api.openai.com/v1
        timeout: 120
      majority_correctness_kwargs:
        model: gpt-4o-mini
        api_key: EMPTY
        service_url: https://api.openai.com/v1
        timeout: 120
    skip_special_tokens: true
    num_cpus: 2
trainer:
  total_epochs: 10
  max_steps: 200
  project_name: ViLaSR-SelfEvolve
  experiment_name: vilasr_selfevolve_4gpu
  logger:
  - file
  - wandb
  nnodes: 1
  n_gpus_per_node: 4
  max_try_make_batch: 30
  world_simulator_max_workers: 4
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 50
  save_limit: 4
  save_model_only: true
  save_checkpoint_path: /data/pengtianshuo/self_evolve/Xinran/checkpoints/vilasr_selfevolve_4gpu
  load_checkpoint_path: null
  find_last_checkpoint: true
